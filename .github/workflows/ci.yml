name: CI

on:
  push:
  pull_request:

# Um push novo cancela a execução anterior da mesma branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, tipos e testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trabalho_1_crud_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # O React Router 8 e o Vitest 5 exigem Node 22.12+/22.22+: `check-latest` pega a 22.x mais nova.
          node-version: 22
          check-latest: true
          cache: npm
          cache-dependency-path: trabalho_1_crud_backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Os testes usam um MongoDB em memória: não precisam de serviço nem de Docker.
      - run: npm test

  frontend:
    name: Frontend (lint, build e testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trabalho_2_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
          cache: npm
          cache-dependency-path: trabalho_2_frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # `build` roda `tsc -b` (checagem de tipos) e depois o `vite build`.
      - run: npm run build
      - run: npm test

  e2e:
    name: Ponta a ponta (Firefox, frontend, API e MongoDB em memória)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
          cache: npm
          cache-dependency-path: |
            e2e/package-lock.json
            trabalho_1_crud_backend/package-lock.json
            trabalho_2_frontend/package-lock.json
      # Os testes usam o código das duas outras pastas: a API roda a partir do fonte e o frontend é compilado.
      - run: npm ci
      - run: npm ci
        working-directory: trabalho_1_crud_backend
      - run: npm ci
        working-directory: trabalho_2_frontend
      - run: npx playwright install --with-deps firefox
      - run: npm run typecheck
      # Sobe MongoDB em memória + API + frontend compilado e controla um Firefox de verdade (ver e2e/README.md).
      - run: npm test
      # Se algo falhar, o relatório traz as capturas de tela e o passo a passo (trace) de cada teste.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: relatorio-e2e
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
